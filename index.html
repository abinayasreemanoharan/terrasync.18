<section class="card" id="emergency">
  <h2>🚨 Worker Emergency</h2>

  <label for="workerId">Worker ID</label>
  <input id="workerId" value="W-104">

  <label for="workerLocation">Construction site location</label>
  <input id="workerLocation" placeholder="Enter site location">

  <label for="emergencyPhoto">Capture emergency photo</label>
  <input id="emergencyPhoto" type="file"
         accept="image/*" capture="environment">

  <img id="photoPreview" alt="Emergency photo preview" hidden>

  <button type="button" onclick="sendEmergency()">
    Send Emergency Report
  </button>

  <button type="button" onclick="call112()">
    Call Emergency Services — 112
  </button>

  <p id="emergencyStatus" role="status">
    No emergency report submitted.
  </p>
</section>

<section class="card">
  <h3>📡 Network Status</h3>
  <p id="networkStatus">Checking connection...</p>
  <p id="pendingCount">Pending reports: 0</p>
</section>

<section class="card">
  <h3>🔋 Device Battery</h3>
  <p id="batteryStatus">Checking battery...</p>
  <div class="battery-track">
    <div id="batteryLevel"></div>
  </div>
  <p id="batteryAdvice">Battery monitoring depends on browser support.</p>
</section>
